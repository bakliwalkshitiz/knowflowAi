services:
  pgvector:
    image: pgvector/pgvector:pg17

    container_name: knowflow-pgvector

    restart: unless-stopped

    environment:
      POSTGRES_DB: knowflow_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - pgvector_data:/var/lib/postgresql/data

volumes:
  pgvector_data: