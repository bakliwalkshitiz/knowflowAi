server:
  port: ${PORT:8080}

spring:
  application:
    name: KnowFlowAI

  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${SPRING_JPA_FORMAT_SQL:false}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/knowflow_ai}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000
      leak-detection-threshold: 60000

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:20MB}
      max-request-size: ${MAX_REQUEST_SIZE:20MB}

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}

      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

    vectorstore:
      pgvector:
        initialize-schema: ${PGVECTOR_INITIALIZE_SCHEMA:true}

    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: ${JDBC_MEMORY_INITIALIZE_SCHEMA:always}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

rag:
  retrieval:
    top-k: ${RAG_TOP_K:5}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.35}

app:
  jwt:
    secret: ${JWT_SECRET:c3VwZXItc2VjcmV0LWtleS1mb3ItZGV2ZWxvcG1lbnQtcGxlYXNlLWNoYW5nZS1pbi1wcm9kdWN0aW9u}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://knowflow-ai-eight.vercel.app}